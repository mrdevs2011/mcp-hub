<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MCP Hub — Gateway for Claude & AI Agents</title>
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="grid-bg" aria-hidden="true"></div>
  <div class="noise" aria-hidden="true"></div>

  <header class="topbar">
    <div class="logo">
      <div class="logo-badge">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
          <polyline points="2 17 12 22 22 17"></polyline>
          <polyline points="2 12 12 17 22 12"></polyline>
        </svg>
      </div>
      <span>MCP<span class="logo-accent">HUB</span></span>
    </div>
    <div id="top-actions" class="top-actions"></div>
  </header>

  <main class="wrap">
    <section class="hero">
      <div class="hero-tag">
        <span class="dot"></span>UNIVERSAL MCP GATEWAY
      </div>
      <h1>Ko'p MCP'larni,<br><span class="h1-accent">Bitta URL orqali boshqar.</span></h1>
      <p class="lead">Claude va AgentAI ga yagona xavfsiz manzil. Yangi connector qo'shsangiz ham asosiy URL hech qachon o'zgarmaydi.</p>
    </section>

    <section id="auth" class="auth-wrap"></section>
    <section id="dashboard" hidden></section>
    <div id="toast" class="toast-wrap"></div>
  </main>

  <script src="/app.js"></script>
</body>
</html>
